<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 피커 체리</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --warning-color: #dc2626;
            --disabled-bg: #f1f5f9;
            --disabled-text: #94a3b8;
            --progress-bg: #dbeafe;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-color: #f1f5f9;
                --text-muted: #94a3b8;
                --primary-color: #3b82f6;
                --primary-dark: #2563eb;
                --border-color: #334155;
                --success-color: #22c55e;
                --warning-color: #f87171;
                --disabled-bg: #1e293b;
                --disabled-text: #64748b;
                --progress-bg: #1e3a5f;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px 16px 20px;
        }

        /* 안드로이드 앱바 스타일 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--primary-color);
            color: #fff;
            padding: 14px 16px;
            position: sticky;
            top: 0;
            z-index: 200;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            width: 100%;
            box-sizing: border-box;
        }

        header h1 {
            font-size: 1.2rem;
            margin: 0;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
        }

        .version-badge {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--primary-color);
            background-color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            letter-spacing: 0.3px;
            line-height: 1.4;
            display: inline-block;
            vertical-align: middle;
        }

        /* 모달 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 14px;
            width: 100%;
            max-width: 480px;
            margin-top: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
            overflow: hidden;
            color: var(--text-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .modal-body {
            padding: 16px 18px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .default-card-block {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 12px;
        }

        .default-card-name {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: #333;
        }

        .default-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            gap: 10px;
        }

        .default-row label {
            font-size: 0.85rem;
            color: #555;
            font-weight: 600;
            white-space: nowrap;
        }

        .default-row select {
            flex: 1;
            max-width: 180px;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .option-group {
            margin-top: 6px;
            padding-top: 8px;
            border-top: 1px dashed #ddd;
        }

        .option-group-title {
            font-size: 0.8rem;
            color: #777;
            margin-bottom: 6px;
        }

        .option-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .option-chip {
            font-size: 0.78rem;
            padding: 4px 10px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.15s;
        }

        .option-chip.active {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }

        .modal-footer {
            padding: 12px 18px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-btn-primary {
            background: var(--primary-color);
            color: #fff;
        }

        .modal-btn-secondary {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        /* 플로팅 액션 버튼 */
        .fab {
            position: fixed;
            right: 20px;
            bottom: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            font-size: 1.8rem;
            font-weight: 300;
            line-height: 1;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, background-color 0.15s;
        }

        .fab:hover {
            background-color: var(--primary-dark);
            transform: scale(1.06);
        }

        .fab:active {
            transform: scale(0.96);
        }

        .options-container {
            position: relative;
        }

        .options-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            color: #fff;
            transition: background-color 0.2s;
        }

        .options-btn:hover {
            background-color: rgba(255,255,255,0.15);
        }

        .options-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 120%;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            z-index: 250;
            min-width: 180px;
            overflow: hidden;
        }

        .options-dropdown.show {
            display: block;
        }

        .options-dropdown button {
            width: 100%;
            padding: 10px 14px;
            border: none;
            background: none;
            font-size: 0.85rem;
            text-align: left;
            cursor: pointer;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .options-dropdown button:hover {
            background-color: #f8f9fa;
            color: var(--primary-color);
        }

        .tab-menu {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: none;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .filter-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .filter-box label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #555;
        }

        .spinner-select {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
        }

        .chart-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .chart-title {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-item {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-name {
            font-weight: bold;
            font-size: 1.05rem;
        }

        .order-btns {
            display: flex;
            gap: 4px;
        }

        .order-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 26px;
            height: 26px;
            font-size: 0.8rem;
            color: var(--text-color);
            cursor: pointer;
        }

        .performance-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }

        .performance-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .performance-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            white-space: nowrap;
        }

        .benefit-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .benefit-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            transition: opacity 0.2s, filter 0.2s;
        }

        .benefit-item.disabled {
            background-color: var(--disabled-bg);
            opacity: 0.65;
            filter: grayscale(0.4);
        }

        .benefit-item.disabled .benefit-name,
        .benefit-item.disabled .benefit-meta,
        .benefit-item.disabled .benefit-limit-row {
            color: var(--disabled-text);
        }

        .benefit-item.disabled .progress-bar-fill {
            background-color: var(--disabled-text);
        }

        .benefit-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }

        .benefit-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .benefit-meta {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 4px;
        }

        .benefit-limit-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }

        .benefit-remaining {
            color: var(--primary-color);
            font-weight: bold;
        }

        .progress-bar-bg {
            background-color: var(--progress-bg);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background-color: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .no-limit-text {
            font-size: 0.8rem;
            color: #888;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 12px;
            color: #888;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .empty-state strong {
            color: var(--primary-color);
        }

        .record-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .form-title {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .record-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-control {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 5px;
        }

        .record-history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .record-history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .record-history-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .type {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .type-discount, .type-청구할인, .type-현장할인 { background-color: #ffebee; color: #d32f2f; }
        .type-point, .type-적립 { background-color: #e8f5e9; color: #2e7d32; }
        .type-cashback, .type-기타 { background-color: #e3f2fd; color: #1976d2; }

        .record-history-right {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .record-history-right .record-amount {
            font-weight: bold;
            white-space: nowrap;
        }

        .record-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .record-actions .edit-btn,
        .record-actions .delete-btn {
            display: block;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 4px 0;
            line-height: 1.4;
            text-align: right;
        }

        .record-actions .edit-btn {
            color: var(--primary-color);
        }

        .record-actions .delete-btn {
            color: #ff5252;
        }

        .history-benefit-name {
            font-size: 0.8rem;
            color: #555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }
    </style>
</head>
<body>

<!-- 안드로이드 앱바 스타일 헤더 (전체 폭) -->
<header>
    <h1>🍒 카드 피커 체리 <span class="version-badge" id="app-version">v1.0.8</span></h1>
    
    <div class="options-container">
        <button class="options-btn" onclick="toggleOptionsMenu(event)" aria-label="옵션 메뉴">⋮</button>
        <div class="options-dropdown" id="options-dropdown">
            <button onclick="triggerCardBenefitsImport()">📥 카드 혜택 가져오기</button>
            <button onclick="openCardDefaultsModal()">⚙️ 카드 기본 설정</button>
            <button onclick="exportData()">📤 데이터 내보내기</button>
            <button onclick="triggerImport()">📥 사용 기록 가져오기</button>
        </div>
    </div>
</header>

<!-- 숨겨진 파일 업로드 인풋 -->
<input type="file" id="import-file-input" accept=".json" style="display: none;" onchange="importData(event)">
<input type="file" id="csv-import-input" accept=".csv" style="display: none;" onchange="importCardBenefitsCSV(event)">

<!-- 카드 기본 설정 모달 -->
<div class="modal-overlay" id="card-defaults-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>⚙️ 카드 기본 설정</h2>
            <button class="modal-close" onclick="closeCardDefaultsModal()">×</button>
        </div>
        <div class="modal-body" id="card-defaults-body">
            <!-- 동적 생성 -->
        </div>
        <div class="modal-footer">
            <button class="modal-btn modal-btn-secondary" onclick="closeCardDefaultsModal()">취소</button>
            <button class="modal-btn modal-btn-primary" onclick="saveCardDefaults()">저장하기</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('tab-status', this)">📊 혜택 사용 현황</button>
        <button class="tab-btn" onclick="switchTab('tab-records', this)">📝 혜택 사용 기록</button>
    </div>

    <!-- TAB 1: 혜택 사용 현황 -->
    <div id="tab-status" class="tab-content active">
        <div class="filter-box">
            <label for="month-spinner">조회 기간 선택</label>
            <select id="month-spinner" class="spinner-select" onchange="handleFilterChange(this.value)">
                <option value="ALL">전체 (월별 추이 그래프)</option>
                <option value="2026-08" selected>2026년 8월</option>
                <option value="2026-07">2026년 7월</option>
                <option value="2026-06">2026년 6월</option>
            </select>
        </div>

        <div class="chart-section" id="chart-section" style="display: none;">
            <div class="chart-title">📊 카드별 월간 혜택 사용량 추이</div>
            <canvas id="benefitChart" height="150"></canvas>
        </div>

        <div class="card-list" id="card-list">
            <!-- 동적 카드 목록 -->
        </div>
    </div>

    <!-- TAB 2: 혜택 사용 기록 -->
    <div id="tab-records" class="tab-content">
        <div class="record-card">
            <div class="record-history-list" id="history-list"></div>
        </div>
    </div>
</div>

<!-- 플로팅 액션 버튼 (기록 추가) -->
<button class="fab" id="fab-add" onclick="openAddRecordModal()" title="혜택 사용 내역 추가" style="display:none;">
    +
</button>

<!-- 기록 추가 모달 -->
<div class="modal-overlay" id="add-record-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>➕ 혜택 사용 내역 등록</h2>
            <button class="modal-close" onclick="closeAddRecordModal()">×</button>
        </div>
        <div class="modal-body">
            <form class="record-form" id="benefit-form" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label>카드 선택</label>
                    <select class="form-control" id="form-card" required onchange="updateBenefitOptions()">
                        <option value="">카드를 선택하세요</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>혜택 선택</label>
                    <select class="form-control" id="form-benefit" required onchange="onBenefitOrPaymentChange()">
                        <option value="">카드를 먼저 선택하세요</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>날짜</label>
                    <input type="date" class="form-control" id="form-date" required>
                </div>
                <div class="form-group">
                    <label>결제 금액 (원)</label>
                    <input type="number" class="form-control" id="form-payment" placeholder="예: 15000" min="0" oninput="onBenefitOrPaymentChange()">
                </div>
                <div class="form-group">
                    <label id="form-amount-label">혜택 금액 / 마일리지</label>
                    <input type="number" class="form-control" id="form-amount" placeholder="자동 계산됩니다" required min="0">
                    <span id="form-calc-hint" style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;"></span>
                </div>
                <button type="submit" class="submit-btn">저장하기</button>
            </form>
        </div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js')
            .then(reg => {
                console.log('Service Worker Registered!', reg);
                // 등록 후 약간의 딜레이를 두고 버전 요청
                setTimeout(fetchAppVersion, 300);
            })
            .catch(err => console.error('Service Worker Registration Failed!', err));

        // 컨트롤러가 이미 있으면 바로, 없으면 controllerchange 대기
        if (navigator.serviceWorker.controller) {
            fetchAppVersion();
        }
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            fetchAppVersion();
        });
    }

    function fetchAppVersion() {
        const badge = document.getElementById('app-version');
        if (!badge) return;

        // 서비스 워커가 아직 제어하지 않으면 기본값 유지
        if (!navigator.serviceWorker.controller) {
            badge.textContent = 'v1.0.8';
            return;
        }

        const channel = new MessageChannel();
        channel.port1.onmessage = (event) => {
            if (event.data && event.data.version) {
                badge.textContent = event.data.version;
            }
        };
        navigator.serviceWorker.controller.postMessage(
            { type: 'GET_VERSION' },
            [channel.port2]
        );
    }

    // ===== 데이터 저장소 =====
    // cardBenefitsData: { "카드명": { "30만원": [ {name, type, rate, limit, option}, ... ], ... }, ... }
    let cardBenefitsData = JSON.parse(localStorage.getItem('card_picker_cherry_benefits')) || null;

    // benefitData: 사용 기록 [{ id, cardName, benefitName, type, date, amount }]
    let benefitData = JSON.parse(localStorage.getItem('card_picker_cherry_data')) || [];

    // performanceData: { "2026-08": { "카드명": "30만원", ... }, ... }  // 선택한 전월 실적 티어
    let performanceData = JSON.parse(localStorage.getItem('card_picker_cherry_perf')) || {};

    // cardDefaults: { "카드명": { defaultTier: "30만원", selectedOptions: ["1"] } }
    let cardDefaults = JSON.parse(localStorage.getItem('card_picker_cherry_defaults')) || {};

    let myChart = null;

    document.addEventListener("DOMContentLoaded", () => {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById("form-date").value = `${yyyy}-${mm}-${dd}`;

        // 버전 배지 강제 표시
        const badge = document.getElementById('app-version');
        if (badge && !badge.textContent.trim()) {
            badge.textContent = 'v1.0.8';
        }
        fetchAppVersion();

        renderAll();
        populateFormCards();
    });

    // 외부 클릭 시 옵션 드롭다운 닫기
    document.addEventListener("click", () => {
        const dropdown = document.getElementById("options-dropdown");
        if (dropdown && dropdown.classList.contains("show")) {
            dropdown.classList.remove("show");
        }
    });

    function toggleOptionsMenu(event) {
        event.stopPropagation();
        document.getElementById("options-dropdown").classList.toggle("show");
    }

    /* --- 카드 혜택 CSV 가져오기 --- */
    function triggerCardBenefitsImport() {
        document.getElementById("csv-import-input").click();
    }

    function importCardBenefitsCSV(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const text = e.target.result;
                const parsed = parseCSV(text);
                if (!parsed || Object.keys(parsed).length === 0) {
                    alert("유효한 카드 혜택 데이터를 찾지 못했습니다. CSV 형식을 확인해 주세요.");
                    return;
                }
                cardBenefitsData = parsed;
                localStorage.setItem('card_picker_cherry_benefits', JSON.stringify(cardBenefitsData));
                // 카드 순서 초기화
                localStorage.removeItem("card_order_cherry");
                renderAll();
                populateFormCards();
                alert(`카드 혜택을 성공적으로 불러왔습니다!\n총 ${Object.keys(cardBenefitsData).length}개 카드`);
            } catch (err) {
                alert("CSV 파일을 읽는 중 오류가 발생했습니다: " + err.message);
            }
            event.target.value = "";
        };
        reader.readAsText(file, 'UTF-8');
    }

    function parseCSV(text) {
        const lines = text.trim().split(/\r?\n/);
        if (lines.length < 2) return null;

        // 헤더 파싱
        const headers = parseCSVLine(lines[0]);
        const expected = ['카드명', '실적', '혜택명', '할인유형', '할인율또는금액', '월간한도', '옵션'];
        // 간단히 인덱스로 매핑 (순서 가정)
        const cards = {};

        for (let i = 1; i < lines.length; i++) {
            const cols = parseCSVLine(lines[i]);
            if (cols.length < 6) continue;

            const cardName = cols[0].trim();
            const tier = cols[1].trim();
            const benefitName = cols[2].trim();
            const type = cols[3].trim();
            const rate = cols[4].trim();
            const limit = cols[5].trim();
            const option = cols.length > 6 ? cols[6].trim() : '';

            if (!cardName || !tier || !benefitName) continue;

            if (!cards[cardName]) cards[cardName] = {};
            if (!cards[cardName][tier]) cards[cardName][tier] = [];

            cards[cardName][tier].push({
                name: benefitName,
                type: type,
                rate: rate,
                limit: limit,
                option: option
            });
        }
        return cards;
    }

    function parseCSVLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(current);
                current = '';
            } else {
                current += char;
            }
        }
        result.push(current);
        return result;
    }

    /* --- 데이터 내보내기 & 사용기록 가져오기 --- */
    function exportData() {
        const exportObj = {
            version: "2.0",
            exportDate: new Date().toISOString(),
            cardBenefitsData: cardBenefitsData,
            benefitData: benefitData,
            performanceData: performanceData,
            cardDefaults: cardDefaults,
            cardOrder: JSON.parse(localStorage.getItem("card_order_cherry")) || []
        };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
        const downloadAnchor = document.createElement("a");
        const yyyymmdd = new Date().toISOString().slice(0, 10).replace(/-/g, "");

        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `card_picker_cherry_backup_${yyyymmdd}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function triggerImport() {
        document.getElementById("import-file-input").click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (imported.benefitData) {
                    benefitData = imported.benefitData;
                    if (imported.performanceData) performanceData = imported.performanceData;
                    if (imported.cardBenefitsData) {
                        cardBenefitsData = imported.cardBenefitsData;
                        localStorage.setItem('card_picker_cherry_benefits', JSON.stringify(cardBenefitsData));
                    }
                    if (imported.cardDefaults) {
                        cardDefaults = imported.cardDefaults;
                        localStorage.setItem('card_picker_cherry_defaults', JSON.stringify(cardDefaults));
                    }
                    if (imported.cardOrder) localStorage.setItem("card_order_cherry", JSON.stringify(imported.cardOrder));

                    saveData();
                    renderAll();
                    populateFormCards();
                    alert("데이터를 성공적으로 불러왔습니다!");
                } else {
                    alert("유효하지 않은 백업 파일 형식입니다.");
                }
            } catch (err) {
                alert("파일을 읽는 중 오류가 발생했습니다: " + err.message);
            }
            event.target.value = "";
        };
        reader.readAsText(file);
    }

    function saveData() {
        localStorage.setItem('card_picker_cherry_data', JSON.stringify(benefitData));
        localStorage.setItem('card_picker_cherry_perf', JSON.stringify(performanceData));
        localStorage.setItem('card_picker_cherry_defaults', JSON.stringify(cardDefaults));
        if (cardBenefitsData) {
            localStorage.setItem('card_picker_cherry_benefits', JSON.stringify(cardBenefitsData));
        }
    }

    /* --- 카드 기본 설정 모달 --- */
    function openCardDefaultsModal() {
        if (!cardBenefitsData || Object.keys(cardBenefitsData).length === 0) {
            alert('먼저 「카드 혜택 가져오기」로 CSV를 불러와 주세요.');
            return;
        }
        renderCardDefaultsForm();
        document.getElementById('card-defaults-modal').classList.add('show');
        document.getElementById('options-dropdown').classList.remove('show');
    }

    function closeCardDefaultsModal() {
        document.getElementById('card-defaults-modal').classList.remove('show');
    }

    function renderCardDefaultsForm() {
        const body = document.getElementById('card-defaults-body');
        body.innerHTML = '';

        const cardOrder = getCardOrder();
        cardOrder.forEach(cardName => {
            const tiers = cardBenefitsData[cardName];
            if (!tiers) return;

            const tierKeys = getTierKeys(tiers);
            const defaults = cardDefaults[cardName] || {};
            const currentTier = defaults.defaultTier || tierKeys[0];
            // selectedOptionBenefits: { "1": "혜택명", "2": "혜택명" }
            const selectedOptionBenefits = defaults.selectedOptionBenefits || {};

            // 옵션 그룹별 혜택명 목록
            const optionMap = {}; // optionValue -> Set of benefit names
            Object.values(tiers).forEach(benefits => {
                benefits.forEach(b => {
                    if (b.option && b.option.trim()) {
                        if (!optionMap[b.option]) optionMap[b.option] = new Set();
                        optionMap[b.option].add(b.name);
                    }
                });
            });

            const hasOptions = Object.keys(optionMap).length > 0;

            let html = `
                <div class="default-card-block" data-card="${cardName}">
                    <div class="default-card-name">💳 ${cardName}</div>
                    <div class="default-row">
                        <label>기본 실적</label>
                        <select class="default-tier-select" data-card="${cardName}">
            `;
            tierKeys.forEach(t => {
                html += `<option value="${t}" ${t === currentTier ? 'selected' : ''}>${formatTierLabel(t)}</option>`;
            });
            html += `</select></div>`;

            if (hasOptions) {
                Object.keys(optionMap).sort().forEach(opt => {
                    const names = Array.from(optionMap[opt]);
                    const selectedName = selectedOptionBenefits[opt] || '';
                    html += `<div class="option-group">
                        <div class="option-group-title">옵션 ${opt} — 혜택 중 하나 선택</div>
                        <select class="form-control option-benefit-select" data-option="${opt}" style="margin-top:4px;">
                            <option value="">선택 안 함</option>`;
                    names.forEach(n => {
                        html += `<option value="${n}" ${n === selectedName ? 'selected' : ''}>${getBenefitEmoji(n)} ${n}</option>`;
                    });
                    html += `</select></div>`;
                });
            }

            html += `</div>`;
            body.insertAdjacentHTML('beforeend', html);
        });
    }

    function saveCardDefaults() {
        const blocks = document.querySelectorAll('#card-defaults-body .default-card-block');
        blocks.forEach(block => {
            const cardName = block.getAttribute('data-card');
            const tierSelect = block.querySelector('.default-tier-select');
            const optionSelects = block.querySelectorAll('.option-benefit-select');
            const selectedOptionBenefits = {};
            optionSelects.forEach(sel => {
                const opt = sel.getAttribute('data-option');
                if (sel.value) selectedOptionBenefits[opt] = sel.value;
            });

            cardDefaults[cardName] = {
                defaultTier: tierSelect ? tierSelect.value : '',
                selectedOptionBenefits: selectedOptionBenefits
            };
        });
        saveData();
        closeCardDefaultsModal();
        const selectedMonth = document.getElementById('month-spinner').value;
        if (selectedMonth !== 'ALL') {
            renderMonthStatus(selectedMonth);
        }
        alert('카드 기본 설정을 저장했습니다.');
    }

    function switchTab(tabId, btn) {

        document.querySelectorAll('.tab-btn').forEach(button => button.classList.remove('active'));

    function editRecord(id) {

        if (!item) return;

        editingId = id;

            unit === '마일' ? '적립 마일리지' : '혜택 금액 (원)';

    function handleFilterChange(selectedMonth) {

    /* --- 한도 숫자 추출 --- */
    function parseLimitAmount(limitStr) {
        if (!limitStr || limitStr === '무제한' || limitStr.trim() === '') return null;
        const match = String(limitStr).replace(/,/g, '').match(/(\d+)/);
        return match ? parseInt(match[1], 10) : null;
    }

    function isMileageUnit(rate, limit) {
        const s = `${rate || ''} ${limit || ''}`;
        return /마일/.test(s);
    }

    function getUnitLabel(rate, limit) {
        return isMileageUnit(rate, limit) ? '마일' : '원';
    }

    function isIntegratedLimit(limitStr) {
        return limitStr && String(limitStr).includes('통합');
    }

    /* 결제금액 + 할인율/금액 식으로 혜택 수치 계산 */
    function calculateBenefitAmount(payment, rateStr, limitStr) {
        if (!rateStr || payment == null || payment < 0) return 0;
        const rate = String(rateStr).replace(/\s/g, '');
        let benefit = 0;

        // 마일리지: "1마일/1000원", "2마일/1000원"
        const mileMatch = rate.match(/(\d+)\s*마일\s*\/\s*(\d+)\s*원/);
        if (mileMatch) {
            const per = parseInt(mileMatch[1], 10);
            const base = parseInt(mileMatch[2], 10) || 1000;
            benefit = Math.floor(payment / base) * per;
        }
        // 정액: "2000원", "6000원"
        else if (/^\d+원$/.test(rate)) {
            benefit = parseInt(rate, 10) || 0;
        }
        // 비율: "10%", "50%", "5%"
        else if (/%$/.test(rate) || rate.includes('%')) {
            const pctMatch = rate.match(/(\d+(?:\.\d+)?)\s*%/);
            if (pctMatch) {
                benefit = Math.floor(payment * parseFloat(pctMatch[1]) / 100);
            }
        }
        // "50%•30%" 같은 복합은 첫 비율 사용
        else {
            const pctMatch = rate.match(/(\d+(?:\.\d+)?)\s*%/);
            if (pctMatch) {
                benefit = Math.floor(payment * parseFloat(pctMatch[1]) / 100);
            } else {
                const numMatch = rate.match(/(\d+)/);
                if (numMatch) benefit = parseInt(numMatch[1], 10);
            }
        }

        // 월간 한도로 캡
        const limitNum = parseLimitAmount(limitStr);
        if (limitNum != null && benefit > limitNum) {
            benefit = limitNum;
        }
        return Math.max(0, benefit);
    }

    function formatTierLabel(tier) {
        if (!tier) return '';
        const normalized = String(tier).replace(/\s/g, '');
        if (normalized === '0만원' || normalized === '0원' || normalized === '없음' || normalized === '__none__') {
            return '실적 없음';
        }
        return tier;
    }

    /* 모든 카드에 실적 없음(0만원) 티어 보장 */
    function getTierKeys(tiers) {
        const keys = Object.keys(tiers || {});
        if (!keys.includes('0만원')) {
            keys.push('0만원');
        }
        return keys.sort((a, b) => (parseInt(a) || 0) - (parseInt(b) || 0));
    }

    function getBenefitsForTier(tiers, tier) {
        if (!tiers) return [];
        if (tier === '0만원' || tier === '__none__') {
            return tiers['0만원'] || [];
        }
        return tiers[tier] || [];
    }

    function getBenefitEmoji(name) {
        if (!name) return '🏷️';
        const n = name.toLowerCase();
        if (/스타벅스|커피/.test(n)) return '☕';
        if (/대중교통|교통|버스|지하철|택시/.test(n)) return '🚌';
        if (/배달/.test(n)) return '🛵';
        if (/이동통신|통신|휴대폰|핸드폰/.test(n)) return '📱';
        if (/아파트|관리비/.test(n)) return '🏢';
        if (/주유|기름/.test(n)) return '⛽';
        if (/의료|병원|약국/.test(n)) return '🏥';
        if (/할인점|마트|이마트|편의점|다이소|올리브영/.test(n)) return '🛒';
        if (/스트리밍|넷플릭스|유튜브|영상/.test(n)) return '📺';
        if (/온라인쇼핑몰|쇼핑|패션|오늘의집/.test(n)) return '🛍️';
        if (/영화|시네마|롯데시네마/.test(n)) return '🎬';
        if (/해외|공항/.test(n)) return '✈️';
        if (/주차/.test(n)) return '🅿️';
        if (/간편결제|페이/.test(n)) return '💳';
        if (/적립|마일|리워드|포인트/.test(n)) return '🪙';
        if (/생활요금|정기결제|공과금/.test(n)) return '💡';
        if (/멤버십|디지털/.test(n)) return '🎫';
        if (/교보|도서|책/.test(n)) return '📚';
        if (/수수료/.test(n)) return '🆓';
        return '🏷️';
    }

    /* 혜택 메타 조회 (카드+혜택명) */
    function findBenefitMeta(cardName, benefitName) {
        if (!cardBenefitsData || !cardBenefitsData[cardName]) return null;
        for (const benefits of Object.values(cardBenefitsData[cardName])) {
            const found = benefits.find(b => b.name === benefitName);
            if (found) return found;
        }
        return null;
    }

    /* --- 카드 순서 --- */
    function getCardOrder() {
        if (!cardBenefitsData) return [];
        const saved = JSON.parse(localStorage.getItem("card_order_cherry"));
        const allCards = Object.keys(cardBenefitsData);
        if (!saved || !Array.isArray(saved)) return allCards;
        // 저장된 순서 유지 + 새로 추가된 카드 뒤에 붙이기
        const ordered = saved.filter(c => allCards.includes(c));
        allCards.forEach(c => { if (!ordered.includes(c)) ordered.push(c); });
        return ordered;
    }

    function saveCardOrder() {
        const items = document.querySelectorAll("#card-list .card-item");
        const order = Array.from(items).map(item => item.getAttribute("data-card"));
        localStorage.setItem("card_order_cherry", JSON.stringify(order));
    }

    function moveCard(button, direction) {
        const item = button.closest(".card-item");
        const cardList = document.getElementById("card-list");
        if (direction === "up" && item.previousElementSibling) {
            cardList.insertBefore(item, item.previousElementSibling);
        } else if (direction === "down" && item.nextElementSibling) {
            cardList.insertBefore(item.nextElementSibling, item);
        }
        saveCardOrder();
    }

    /* --- 전월 실적 티어 변경 --- */
    function changePerformanceTier(cardName, tier) {
        const selectedMonth = document.getElementById('month-spinner').value;
        if (selectedMonth === 'ALL') return;

        if (!performanceData[selectedMonth]) {
            performanceData[selectedMonth] = {};
        }
        performanceData[selectedMonth][cardName] = tier;
        saveData();
        renderMonthStatus(selectedMonth);
    }

    /* --- 월별 현황 렌더링 --- */
    function renderMonthStatus(targetMonth) {
        const cardListEl = document.getElementById('card-list');
        cardListEl.innerHTML = '';

        if (!cardBenefitsData || Object.keys(cardBenefitsData).length === 0) {
            cardListEl.innerHTML = `
                <div class="empty-state">
                    아직 카드 혜택 정보가 없습니다.<br>
                    우측 상단 <strong>⋮</strong> 메뉴에서<br>
                    <strong>「카드 혜택 가져오기」</strong>로 CSV 파일을 불러와 주세요.
                </div>`;
            return;
        }

        const monthPerf = performanceData[targetMonth] || {};
        const cardOrder = getCardOrder();

        cardOrder.forEach(cardName => {
            const tiers = cardBenefitsData[cardName];
            if (!tiers) return;

            const tierKeys = getTierKeys(tiers);

            // 현재 선택된 티어 (월별 설정 > 기본 설정 > 가장 낮은 티어)
            const defaults = cardDefaults[cardName] || {};
            let selectedTier = monthPerf[cardName] || defaults.defaultTier || tierKeys[0];
            if (!tierKeys.includes(selectedTier)) selectedTier = tierKeys[0];

            // 선택된 옵션 혜택: 옵션 그룹별 선택된 혜택명만 표시
            const selectedOptionBenefits = defaults.selectedOptionBenefits || {};
            let benefits = getBenefitsForTier(tiers, selectedTier).filter(b => {
                if (!b.option || !b.option.trim()) return true;
                const chosen = selectedOptionBenefits[b.option];
                // 옵션 선택을 안 했으면 해당 옵션 혜택 전부 숨김 (전월실적으로 받을 수 있는 것만 명확히)
                if (!chosen) return false;
                return b.name === chosen;
            });

            const cardDiv = document.createElement('div');
            cardDiv.className = 'card-item';
            cardDiv.setAttribute('data-card', cardName);

            let html = `
                <div class="card-header">
                    <div class="card-title-group">
                        <span class="card-name">💳 ${cardName}</span>
                    </div>
                    <div class="order-btns">
                        <button class="order-btn" onclick="moveCard(this, 'up')">▲</button>
                        <button class="order-btn" onclick="moveCard(this, 'down')">▼</button>
                    </div>
                </div>

                <div class="performance-box">
                    <div class="performance-top-row">
                        <span class="performance-label">전월 실적</span>
                        <select class="spinner-select" onchange="changePerformanceTier('${cardName.replace(/'/g, "\\'")}', this.value)">
            `;

            tierKeys.forEach(t => {
                const selected = t === selectedTier ? 'selected' : '';
                html += `<option value="${t}" ${selected}>${formatTierLabel(t)}</option>`;
            });

            html += `
                        </select>
                    </div>
                </div>

                <div class="benefit-list">
            `;

            if (benefits.length === 0) {
                html += `<div style="font-size:0.85rem;color:var(--text-muted);">이 실적 구간에 해당하는 혜택이 없습니다.</div>`;
            } else {
                // 통합 한도 그룹핑
                const integratedGroups = {}; // limitStr -> [benefits]
                const normalBenefits = [];
                benefits.forEach(ben => {
                    if (isIntegratedLimit(ben.limit)) {
                        const key = ben.limit;
                        if (!integratedGroups[key]) integratedGroups[key] = [];
                        integratedGroups[key].push(ben);
                    } else {
                        normalBenefits.push(ben);
                    }
                });

                // 통합 한도 그룹 렌더
                Object.keys(integratedGroups).forEach(limitKey => {
                    const group = integratedGroups[limitKey];
                    const limitNum = parseLimitAmount(limitKey);
                    const unit = getUnitLabel(group[0].rate, limitKey);
                    const names = group.map(b => b.name);
                    const used = benefitData
                        .filter(item => item.cardName === cardName &&
                                        names.includes(item.benefitName) &&
                                        item.date.startsWith(targetMonth))
                        .reduce((sum, item) => sum + item.amount, 0);
                    const isUnlimited = !limitNum;
                    const remain = isUnlimited ? null : Math.max(0, limitNum - used);
                    const percent = isUnlimited ? 0 : Math.min(100, Math.round((used / limitNum) * 100));
                    const isExhausted = !isUnlimited && remain === 0;
                    const disabledClass = isExhausted ? ' disabled' : '';

                    html += `<div class="benefit-item${disabledClass}">
                        <div class="benefit-item-header">
                            <span class="benefit-name">🔗 통합 한도 혜택</span>
                            <span class="type type-청구할인">통합</span>
                        </div>
                        <div class="benefit-meta">${group.map(b => getBenefitEmoji(b.name) + ' ' + b.name).join(' · ')}</div>`;

                    if (isUnlimited) {
                        html += `<div class="benefit-limit-row">
                            <span>사용: <strong>${used.toLocaleString()}${unit}</strong></span>
                            <span class="no-limit-text">한도 없음</span>
                        </div>`;
                    } else {
                        html += `<div class="benefit-limit-row">
                            <span>사용: <strong>${used.toLocaleString()}${unit}</strong> / ${limitNum.toLocaleString()}${unit}</span>
                            <span class="benefit-remaining">${isExhausted ? '한도 소진' : '잔여: ' + remain.toLocaleString() + unit}</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width:${percent}%"></div>
                        </div>`;
                    }
                    html += `</div>`;

                    // 개별 혜택명만 간단히 표시 (한도 바 없이)
                    group.forEach(ben => {
                        const typeClass = 'type-' + (ben.type || 'discount').replace(/\s/g, '');
                        html += `<div class="benefit-item" style="margin-left:8px;opacity:0.9;">
                            <div class="benefit-item-header">
                                <span class="benefit-name">${getBenefitEmoji(ben.name)} ${ben.name}</span>
                                <span class="type ${typeClass}">${ben.type || ''}</span>
                            </div>
                            <div class="benefit-meta">${ben.rate || ''} (통합 한도 적용)</div>
                        </div>`;
                    });
                });

                // 일반 혜택 렌더
                normalBenefits.forEach(ben => {
                    const used = benefitData
                        .filter(item => item.cardName === cardName &&
                                        item.benefitName === ben.name &&
                                        item.date.startsWith(targetMonth))
                        .reduce((sum, item) => sum + item.amount, 0);

                    const limitNum = parseLimitAmount(ben.limit);
                    const unit = getUnitLabel(ben.rate, ben.limit);
                    const isUnlimited = !limitNum;
                    const remain = isUnlimited ? null : Math.max(0, limitNum - used);
                    const percent = isUnlimited ? 0 : Math.min(100, Math.round((used / limitNum) * 100));
                    const typeClass = 'type-' + (ben.type || 'discount').replace(/\s/g, '');
                    const isExhausted = !isUnlimited && remain === 0;
                    const emoji = getBenefitEmoji(ben.name);
                    const disabledClass = isExhausted ? ' disabled' : '';

                    html += `
                        <div class="benefit-item${disabledClass}">
                            <div class="benefit-item-header">
                                <span class="benefit-name">${emoji} ${ben.name}</span>
                                <span class="type ${typeClass}">${ben.type || ''}</span>
                            </div>
                            <div class="benefit-meta">${ben.rate || ''} ${ben.option ? '(옵션 ' + ben.option + ')' : ''}</div>
                    `;

                    if (isUnlimited) {
                        html += `
                            <div class="benefit-limit-row">
                                <span>사용: <strong>${used.toLocaleString()}${unit}</strong></span>
                                <span class="no-limit-text">${ben.limit || '한도 없음'}</span>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="benefit-limit-row">
                                <span>사용: <strong>${used.toLocaleString()}${unit}</strong> / ${limitNum.toLocaleString()}${unit}</span>
                                <span class="benefit-remaining">${isExhausted ? '한도 소진' : '잔여: ' + remain.toLocaleString() + unit}</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width:${percent}%"></div>
                            </div>
                        `;
                    }

                    html += `</div>`;
                });
            }

            html += `</div>`;
            cardDiv.innerHTML = html;
            cardListEl.appendChild(cardDiv);
        });
    }

    /* --- 차트 --- */
    function renderChart() {
        if (!cardBenefitsData) {
            if (myChart) { myChart.destroy(); myChart = null; }
            return;
        }

        const months = ['2026-06', '2026-07', '2026-08'];
        const cardNames = getCardOrder();
        const colors = ['#2563eb', '#3b82f6', '#60a5fa', '#6366f1', '#8b5cf6', '#0ea5e9', '#10b981'];

        const datasets = cardNames.map((name, idx) => {
            const data = months.map(m =>
                benefitData
                    .filter(i => i.cardName === name && i.date.startsWith(m))
                    .reduce((s, i) => s + i.amount, 0)
            );
            return {
                label: name.length > 12 ? name.slice(0, 12) + '…' : name,
                data: data,
                backgroundColor: colors[idx % colors.length]
            };
        });

        const ctx = document.getElementById('benefitChart').getContext('2d');
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['6월', '7월', '8월'],
                datasets: datasets
            },
            options: {
                responsive: true,
                scales: {
                    x: { stacked: false },
                    y: { beginAtZero: true }
                },
                plugins: {
                    legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
                }
            }
        });
    }

    /* --- 기록 폼 --- */
    function populateFormCards() {
        const select = document.getElementById('form-card');
        select.innerHTML = '<option value="">카드를 선택하세요</option>';
        if (!cardBenefitsData) return;

        getCardOrder().forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            select.appendChild(opt);
        });
        updateBenefitOptions();
    }

    function updateBenefitOptions() {
        const cardName = document.getElementById('form-card').value;
        const benefitSelect = document.getElementById('form-benefit');
        benefitSelect.innerHTML = '';

        if (!cardName || !cardBenefitsData || !cardBenefitsData[cardName]) {
            benefitSelect.innerHTML = '<option value="">카드를 먼저 선택하세요</option>';
            return;
        }

        const benefitMap = new Map();
        Object.values(cardBenefitsData[cardName]).forEach(benefits => {
            benefits.forEach(b => {
                if (!benefitMap.has(b.name)) {
                    benefitMap.set(b.name, b);
                }
            });
        });

        benefitSelect.innerHTML = '<option value="">혜택을 선택하세요</option>';
        benefitMap.forEach((b, name) => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = `${getBenefitEmoji(name)} ${name} (${b.type})`;
            opt.dataset.type = b.type || '';
            opt.dataset.rate = b.rate || '';
            opt.dataset.limit = b.limit || '';
            benefitSelect.appendChild(opt);
        });

        document.getElementById('form-payment').value = '';
        document.getElementById('form-amount').value = '';
        document.getElementById('form-calc-hint').textContent = '';
    }

    function onBenefitOrPaymentChange() {
        const cardName = document.getElementById('form-card').value;
        const benefitName = document.getElementById('form-benefit').value;
        const payment = Number(document.getElementById('form-payment').value) || 0;
        const amountInput = document.getElementById('form-amount');
        const amountLabel = document.getElementById('form-amount-label');
        const hint = document.getElementById('form-calc-hint');

        if (!cardName || !benefitName) {
            amountLabel.textContent = '혜택 금액 / 마일리지';
            hint.textContent = '';
            return;
        }

        const meta = findBenefitMeta(cardName, benefitName);
        if (!meta) return;

        const unit = getUnitLabel(meta.rate, meta.limit);
        amountLabel.textContent = unit === '마일' ? '적립 마일리지' : '혜택 금액 (원)';

        if (payment <= 0) {
            amountInput.value = '';
            hint.textContent = `계산식: ${meta.rate || '-'} / 한도: ${meta.limit || '없음'}`;
            return;
        }

        const calculated = calculateBenefitAmount(payment, meta.rate, meta.limit);
        amountInput.value = calculated;
        hint.textContent = `자동 계산: ${meta.rate || '-'} → ${calculated.toLocaleString()}${unit} (한도: ${meta.limit || '없음'}) · 수동 수정 가능`;
    }

    function handleFormSubmit(e) {
        e.preventDefault();
        if (!cardBenefitsData) {
            alert('먼저 카드 혜택 CSV를 가져와 주세요.');
            return;
        }

        const cardName = document.getElementById('form-card').value;
        const benefitName = document.getElementById('form-benefit').value;
        const date = document.getElementById('form-date').value;
        const amount = Number(document.getElementById('form-amount').value);
        const payment = Number(document.getElementById('form-payment').value) || 0;
        const benefitSelect = document.getElementById('form-benefit');
        const type = benefitSelect.options[benefitSelect.selectedIndex]?.dataset?.type || '';

        if (!cardName || !benefitName || !date || amount < 0 || isNaN(amount)) {
            alert('모든 항목을 올바르게 입력해 주세요.');
            return;
        }

        const meta = findBenefitMeta(cardName, benefitName);
        const unit = meta ? getUnitLabel(meta.rate, meta.limit) : '원';

        if (editingId != null) {
            const idx = benefitData.findIndex(r => r.id === editingId);
            if (idx !== -1) {
                benefitData[idx] = {
                    ...benefitData[idx],
                    cardName,
                    benefitName,
                    type,
                    date,
                    amount,
                    payment,
                    unit
                };
            }
        } else {
            benefitData.push({
                id: Date.now(),
                cardName,
                benefitName,
                type,
                date,
                amount,
                payment,
                unit
            });
        }
        saveData();
        renderAll();
        document.getElementById('form-amount').value = '';
        document.getElementById('form-payment').value = '';
        document.getElementById('form-calc-hint').textContent = '';
        closeAddRecordModal();
    }

    function deleteRecord(id) {
        if (!confirm('정말 이 기록을 삭제하시겠습니까?')) return;
        benefitData = benefitData.filter(item => item.id !== id);
        saveData();
        renderAll();
    }

    function renderHistoryList() {
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = '';

        if (benefitData.length === 0) {
            historyList.innerHTML = '<div style="font-size:0.85rem; color:#888; text-align:center; padding:10px;">등록된 내역이 없습니다.</div>';
            return;
        }

        benefitData.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(item => {
            const div = document.createElement('div');
            div.className = 'record-history-item';
            const typeClass = 'type-' + (item.type || 'discount').replace(/\s/g, '');
            div.innerHTML = `
                <div class="record-history-left">
                    <span class="type ${typeClass}">${item.type || '혜택'}</span>
                    <div style="min-width:0;">
                        <strong style="display:block; font-size:0.85rem;">💳 ${item.cardName}</strong>
                        <span class="history-benefit-name" title="${item.benefitName}">${getBenefitEmoji(item.benefitName)} ${item.benefitName}</span>
                        <span style="font-size:0.75rem; color:#888; display:block;">${item.date}</span>
                    </div>
                </div>
                <div class="record-history-right">
                    <span class="record-amount">${item.amount.toLocaleString()}${item.unit || '원'}</span>
                    <div class="record-actions">
                        <button type="button" class="delete-btn" onclick="deleteRecord(${item.id})">삭제</button>
                        <button type="button" class="edit-btn" onclick="editRecord(${item.id})">수정</button>
                    </div>
                </div>
            `;
            historyList.appendChild(div);
        });
    }
</script>

</body>
